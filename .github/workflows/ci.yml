name: Data Portfolio Pipeline Governance Audit

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements-dev.txt

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Validate Links
        run: |
          python tools/validate_markdown_links.py

      - name: Export Link Errors
        run: |
          python tools/export_link_errors_csv.py

      - name: Compliance Report
        run: |
          python tools/portfolio_compliance_report.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: governance-reports
          path: reports/
