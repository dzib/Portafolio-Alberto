environment:
  name: "development"
  version: "2.3.0"
  author: "Jesús Alberto Dzib Ku"

database:
  driver: "ODBC Driver 17 for SQL Server"
  server: "localhost"
  port: 1433
  trusted_connection: true
  encrypt: false

storage:
  local_path: "D:/Dev/Portafolio-Alberto/"
  cloud_warehouse: "Google Cloud BigQuery"
  dataset_region: "US"

execution:
  batch_size: 10000
  fast_executemany: true
  log_level: "INFO"
