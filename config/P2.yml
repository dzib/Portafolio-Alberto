# ==========================================
# Configuración de Módulo - Dzib Standard V2.3.0
# Módulo: P2_Escolar
# ==========================================

project: P2_Escolar

environment:
  name: "development"
  version: "2.3.0"
  module_target: "P2_Escolar"

database:
  driver: "ODBC Driver 17 for SQL Server"
  server: "localhost"
  port: 1433
  trusted_connection: true

execution:
  batch_size: 10000
  fast_executemany: true
  log_level: "INFO"

score_weight:
  architecture: 20
  documentation: 25
  qa: 25
  evidence: 15
  performance: 15

required_docs:
  - business_requirements.md
  - business_rules.md
  - kpis.md

required_technical:
  - components.md
  - data_dictionary.md
  - data_flow.md
  - dependencies.md

required_reports:
  - benchmark_results.md
  - performance_metrics.md
  - qa_execution_results.md
