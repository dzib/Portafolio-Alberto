project: "P5_BigQuery_Fintech"

environment:
  name: "development"
  version: "2.3.0"
  module_target: "P5_BigQuery_Fintech"

cloud_warehouse:
  provider: "Google Cloud Platform"
  service: "BigQuery"
  dataset_region: "US"
  query_execution: "Serverless"

score_weight:
